[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burhan-scanner"
version = "0.1.0"
description = "Evidence-driven web security scanner"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Shield-1.0.0"
dependencies = [
  "cryptography>=50.0.2",
  "blake3==1.0.11",
  "numpy>=2.5.4",
  "python-docx>=1.2.0",
]
authors = [{name = "Burhan contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
burhan = "burhan.cli:main"

[tool.setuptools.packages.find]
include = ["burhan*"]
