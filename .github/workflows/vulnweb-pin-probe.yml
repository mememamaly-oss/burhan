name: vulnweb scope-page pin probe (round 12)
# One job: fetch www.vulnweb.com LIVE from a GitHub runner (the dev sandbox's
# egress cannot reach that host — DNS resolves, TCP times out; recorded in
# authorized-targets.json's pending-pin note since 2026-11-03) and print the
# candidate permission sentence the authorization gate's own heuristic
# (_candidate_permission_sentence) observes. The output is FOR THE OWNER to
# pin: nothing here authorizes a scan by itself, and the gate keeps refusing
# vulnweb until the exact quote is pinned in authorized-targets.json.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose pin probe or the internal competitor lab"
        required: true
        type: choice
        default: pin
        options: [pin, internal, active]

permissions:
  contents: read

jobs:
  pin-probe:
    name: Fetch vulnweb.com permission page (for owner pinning)
    if: ${{ inputs.mode == 'pin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live fetch + the gate's own candidate-sentence heuristic
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          url = "https://www.vulnweb.com/"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "burhan-authorization-pin-probe/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  page = r.read().decode("utf-8", "replace")
              print(f"fetch OK: {url} -> {len(page)} bytes, final URL {r.url}")
          except Exception as e:
              print(f"::error::live fetch failed: {type(e).__name__}: {e}")
              sys.exit(1)

          # strip tags the way a reader would, then run the GATE's own
          # heuristic verbatim (burhan/authorized_targets.py imports cleanly)
          sys.path.insert(0, ".")
          from burhan.authorized_targets import _candidate_permission_sentence
          text = re.sub(r"<[^>]+>", " ", page)
          candidate = _candidate_permission_sentence(text)
          print("OBSERVED CANDIDATE (gate heuristic, verbatim for pinning):")
          print("=" * 70)
          print(repr(candidate))
          print("=" * 70)

          # machine-readable record for the artifact
          open("vulnweb-pin-probe.json", "w").write(json.dumps({
              "when": __import__("time").strftime("%Y-%m-%dT%H:%M:%SZ", __import__("time").gmtime()),
              "url": url,
              "bytes": len(page),
              "candidate_sentence": candidate,
              "note": ("candidate printed BY THE GATE'S OWN heuristic for the "
                       "owner to pin in authorized-targets.json "
                       "(required_quote); pinning stays a manual owner action"),
          }, indent=1, ensure_ascii=False))
          PY

      - name: Upload the probe record
        uses: actions/upload-artifact@v4
        with:
          name: vulnweb-pin-probe
          path: vulnweb-pin-probe.json
          if-no-files-found: error


  competitor-comparison:
    name: Internal ZAP and Nuclei comparison (development set)
    if: ${{ inputs.mode == 'internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Nuclei templates (networked preparation)
        run: |
          set -euo pipefail
          version=v10.5.0
          commit=f8b8b8dcd70d93826c3767e1829ef8243af9f03b
          sha256=80fbabceca095fac40afecc7f023748df22b9576b9ff10a4422bd2fbf81f9a41
          mkdir -p .ci/nuclei-templates
          curl -fsSL "https://codeload.github.com/projectdiscovery/nuclei-templates/tar.gz/refs/tags/${version}" -o /tmp/nuclei-templates.tar.gz
          echo "${sha256}  /tmp/nuclei-templates.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nuclei-templates.tar.gz --strip-components=1 -C .ci/nuclei-templates
          count="$(find .ci/nuclei-templates -type f -name '*.yaml' ! -path '*/phasec/*' ! -path '*/seal/*' | wc -l | tr -d ' ')"
          test "$count" -gt 0
          printf '%s\n' "$count" > .ci/nuclei-template-count
          printf 'nuclei_templates_version=%s\n' "$version"
          printf 'nuclei_templates_commit=%s\n' "$commit"
          printf 'nuclei_templates_tar_sha256=%s\n' "$sha256"
          printf 'nuclei_templates_loaded=%s\n' "$count"

      - name: Generate ephemeral owner credential
        run: |
          set -euo pipefail
          owner_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$owner_password"
          printf 'BURHAN_OWNER_PASSWORD=%s\n' "$owner_password" >> "$GITHUB_ENV"
          printf 'BURHAN_OWNER_GATE=%s/burhan-owner-gate.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Run only the pinned internal lab
        run: bash scripts/ci_internal_competitor.sh

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-comparison-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

      - name: Remove ephemeral owner credential and gate
        if: always()
        run: |
          set -euo pipefail
          rm -f "${BURHAN_OWNER_GATE:-$RUNNER_TEMP/burhan-owner-gate.json}"
          printf 'BURHAN_OWNER_PASSWORD=\nBURHAN_OWNER_GATE=\n' >> "$GITHUB_ENV"

  active-zap:
    name: Internal ZAP active scan (time-limited development set)
    if: ${{ inputs.mode == 'active' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run only the pinned internal active-ZAP lab
        run: ACTIVE_ZAP_ONLY=1 bash scripts/ci_internal_competitor.sh

      - name: Upload active-ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-active-zap-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
