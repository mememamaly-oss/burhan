name: Live validation (crAPI + DVGA — modern battery v2)

# PART 3 (owner order 2026-10-31): the modern battery v2 layers against two
# MORE real-world targets the engine has never seen — same honesty contract
# as the Juice Shop job: official images, ground truth recorded from each
# project's official documentation BEFORE any scan, every finding scored
# confirmed-positive / unjudged / expected-miss. Misses are RECORDED, never
# hidden; they are not gate failures (this is validation, not a benchmark).
#
#   crAPI (OWASP/crAPI, pinned VERSION 1.1.5 via the official deploy compose)
#     3A jwt_weak_secret          — docs challenge 15 (JWT forgery; the
#                                   documented mechanism is algorithm
#                                   confusion, NOT a wordlist secret — an
#                                   engine miss is an honest NOT-FOUND)
#     3D excessive_data_exposure  — docs challenges 4+5 (sensitive data of
#                                   other users; internal video property)
#
#   PART 4 (owner order 2026-11-02) — the four new layers, same contract:
#     PART 0 jwt_signature_not_enforced + fam1 jwt_algorithm_confusion +
#          fam2 jwt_none_acceptance — challenge 15 ("find ANY one way to
#          forge"); run 9 live-proved the dashboard reads claims without
#          verifying the signature.
#     3E  bfla                    — docs challenge 7, under the LITERAL
#                                  "## BFLA" heading: the admin delete
#                                  route (ProfileController.java, in BOTH
#                                  v1.1.5 and main — checksums below pin
#                                  both eras) performs no role check. The
#                                  authz battery logs in BOTH official
#                                  seeded accounts (TestUsers.java:
#                                  test@ ROLE_USER / admin@ ROLE_ADMIN)
#                                  via json_login — the token arrives in
#                                  the login response BODY and is armed
#                                  as each session's Bearer header.
#     3F  race_condition         — ONE operator-declared candidate only
#                                  (order 2.2 — never blind): POST
#                                  /workshop/api/mechanic/signup, the
#                                  v1.1.5 check-then-insert handler with
#                                  a UNIQUE email constraint; the burst
#                                  email is fresh per run so weekly runs
#                                  never fight over consumed state.
#     3G  shadow_api_endpoint +  — diffs the crawl against crAPI's own
#         zombie_api_endpoint      openapi-spec/crapi-openapi-spec.json
#                                  (main). The spec does NOT exist at the
#                                  v1.1.5 tag (HTTP 404, verified) — the
#                                  version drift is part of the recorded
#                                  ground truth, never silent.
#   DVGA (dolevf/dvga, Docker Hub)
#     3C graphql_aliasing         — README "Aliases based Attack" scenario

on:
  workflow_dispatch:
    inputs:
      oast:
        description: "OAST channel for the live scans (Part 5.1): local listener (default) or interact.sh"
        type: choice
        default: local
        options: [local, interactsh]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday — same cadence as CodeQL

permissions:
  contents: read

jobs:
  live-validation:
    name: Real targets (crAPI v1.1.5 + DVGA — modern v2 layers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      docker:
        image: docker:27-dind
        options: >-
          --privileged
          --name docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start crAPI (official compose v1.1.5 + latest images, bridge vars)
        run: |
          set +e
          # Docker Hub publishes crAPI images as :latest ONLY (verified via
          # the registry API: 1.1.5/v1.1.5/1.1.4 all 404) — so a true
          # image-version pin is impossible; the compose is pinned to the
          # v1.1.5 tag, and the era gap is bridged explicitly below.
          curl -sL -o /tmp/crapi.zip https://github.com/OWASP/crAPI/archive/refs/tags/v1.1.5.zip
          unzip -q /tmp/crapi.zip -d /tmp
          cd /tmp/crAPI-1.1.5/deploy/docker
          # run-2 finding (41282389250): crapi-web's nginx template (latest
          # image) renders an /chatbot/ upstream and a MailHog upstream from
          # CHATBOT_SERVICE / MAILHOG_WEB_SERVICE — the v1.1.5 compose sets
          # neither, nginx dies with "no host in upstream" (template line
          # 73, verified by extracting the template from the image). Bridge:
          # MAILHOG_WEB_SERVICE points at the real mailhog service;
          # CHATBOT_SERVICE must name a REAL host: nginx resolves
          # upstream hostnames at config-parse time and dies on an
          # unknown name (run 41285571697: 'host not found in upstream
          # "chatbot"'). crapi-workshop exists in this stack; /chatbot/
          # would proxy to it and 404 — the battery scans challenges
          # 4/5/15 only and never touches /chatbot/.
          cat > docker-compose.override.yml <<'YAML'
          services:
            crapi-web:
              environment:
                - CHATBOT_SERVICE=crapi-workshop:8000
                - MAILHOG_WEB_SERVICE=mailhog:8025
          YAML
          # ports publish INSIDE the dind service container's namespace —
          # the job runner reaches them via the service hostname "docker",
          # so they must bind 0.0.0.0 of the dind (the private runner
          # network, not public), not the dind's loopback
          sed -i 's|^LISTEN_IP=.*|LISTEN_IP=0.0.0.0|' .env
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker compose -f docker-compose.yml -f docker-compose.override.yml pull
          # non-fatal: a service exiting during compose-up must not end the
          # step before we can capture its container logs
          docker compose -f docker-compose.yml -f docker-compose.override.yml --compatibility up -d
          echo "compose up exit: $?"
          # readiness is probed in the scan step, from a --network host
          # container inside the dind — the SAME network path the scan
          # itself uses (run 41286864928 lesson: the job runner could
          # not reach the dind's published ports at all)

      - name: Start DVGA (official Docker Hub image)
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          # publish on the dind interface (reachable as http://docker:PORT
          # from the job runner), not the dind's loopback
          docker run -d --name dvga -p 5013:5013 -e WEB_HOST=0.0.0.0 dolevf/dvga
          # readiness probed from the scan container (same path as the scan)

      - name: Record pre-scan ground-truth checksums + fetch the operator spec
        # PART 4: the checksums pin every ground-truth source this run
        # scores against — including BOTH eras of ProfileController.java
        # (v1.1.5 + main: challenge 7's no-role-check admin delete route
        # exists in the pinned deployment era, not only on main) and the
        # seeded TestUsers.java ladder the authz battery logs into. The
        # openapi spec is FETCHED here (main branch — it does not exist
        # at the v1.1.5 tag, HTTP 404 verified: the documented drift)
        # into .live-spec/ so the scan step's tar staging carries it
        # into scanbox; its sha256 rides in the same checksum artifact.
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          def sha(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return hashlib.sha256(r.read()).hexdigest()
          gt = {
            "crapi_challenges_md": sha("https://raw.githubusercontent.com/OWASP/crAPI/main/docs/challenges.md"),
            "crapi_jwtprovider": sha("https://raw.githubusercontent.com/OWASP/crAPI/main/services/identity/src/main/java/com/crapi/config/JwtProvider.java"),
            "dvga_readme": sha("https://raw.githubusercontent.com/dolevf/Damn-Vulnerable-GraphQL-Application/master/README.md"),
            # PART 4 ground truth (2026-11-02)
            "crapi_profilecontroller_v115": sha("https://raw.githubusercontent.com/OWASP/crAPI/v1.1.5/services/identity/src/main/java/com/crapi/controller/ProfileController.java"),
            "crapi_profilecontroller_main": sha("https://raw.githubusercontent.com/OWASP/crAPI/main/services/identity/src/main/java/com/crapi/controller/ProfileController.java"),
            "crapi_testusers": sha("https://raw.githubusercontent.com/OWASP/crAPI/main/services/identity/src/main/java/com/crapi/constant/TestUsers.java"),
          }
          # the operator-supplied spec (main) — fetched to .live-spec/ so
          # the tar staging below carries it into scanbox
          spec_url = "https://raw.githubusercontent.com/OWASP/crAPI/main/openapi-spec/crapi-openapi-spec.json"
          os.makedirs(".live-spec", exist_ok=True)
          with urllib.request.urlopen(spec_url, timeout=30) as r:
              body = r.read()
          open(os.path.join(".live-spec", "crapi-openapi-spec.json"), "wb").write(body)
          gt["crapi_openapi_spec_main"] = hashlib.sha256(body).hexdigest()
          print(json.dumps(gt, indent=1))
          # RUNNER_TEMP via os.environ — the quoted heredoc does not
          # expand $RUNNER_TEMP, and a literal '$RUNNER_TEMP/...' path
          # does not exist (run 41310908793: FileNotFoundError)
          out = os.path.join(os.environ["RUNNER_TEMP"], "ground-truth-sha.json")
          open(out, "w").write(json.dumps(gt))
          PY

      - name: Run live validation (PART 0/1/2 + 3A/3D/3E/3F/3G vs crAPI, 3C vs DVGA)
        # run 41286864928: the whole crAPI stack was healthy and ports
        # published on the dind's 0.0.0.0 — but the JOB RUNNER could not
        # reach them (the dind service container's network namespace is
        # not the runner's). Fix: the scan runs INSIDE the dind, in a
        # python container on the dind's host network, where the
        # published ports are reachable as 127.0.0.1 — and the readiness
        # probes use the exact same path the scan will use.
        # No pip install needed: the scanner's import chain is pure
        # stdlib (verified — orchestrator and everything it pulls avoid
        # the cryptography/blake3 requirements, those are for vault/
        # proof/signing, which the live battery does not exercise).
        run: |
          set -e
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker volume create scanout >/dev/null
          docker run -d --name scanbox --network host \
            -v scanout:/out python:3.12-slim sleep 900 >/dev/null
          docker exec scanbox mkdir -p /ws
          # stage the engine (tar-pipe through the API; skip .git etc.)
          # .live-spec/ rides along — the checksums step fetched crAPI's
          # main-branch openapi spec there before this step
          tar --exclude=.git --exclude=node_modules --exclude=.next \
            -cf - . | docker exec -i scanbox tar -xf - -C /ws
          # readiness: both targets, through the scan's own network path
          docker exec scanbox python3 - <<'PY'
          import sys, time, urllib.request
          targets = [
              ("crAPI", "http://127.0.0.1:8888/web/health"),
              ("DVGA",  "http://127.0.0.1:5013/"),
          ]
          for name, url in targets:
              for attempt in range(90):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as r:
                          if r.status < 500:
                              print(f"{name} up (attempt {attempt + 1})")
                              break
                  except Exception:
                      pass
                  time.sleep(2)
              else:
                  print(f"::error::{name} did not come up in 180s "
                        f"({url}, probed from inside the dind)")
                  sys.exit(1)
          PY
          docker exec -e BURHAN_LIVE_OAST=${{ inputs.oast || 'local' }} scanbox \
            python3 /ws/scripts/live_validate_modern2.py \
            --crapi http://127.0.0.1:8888 \
            --dvga http://127.0.0.1:5013 \
            --crapi-spec /ws/.live-spec/crapi-openapi-spec.json \
            --max-requests 12000 \
            --out-dir /out/live
          # 12000 (was 4000): live round 3 (run 41584520525) — the loopback
          # normalization put crAPI's 44 spec paths IN scope, the endpoint
          # map tripled, and the legacy battery lawfully consumed the whole
          # 4000 cap over the new surface BEFORE the crawler (5 pages left),
          # the JWT differentials (harvest clean), and the zombie checks
          # (all probes BUDGET_REACHED) could run. A starved stage is an
          # honest UNTESTABLE, never a forged negative — but the budget must
          # fit the surface the spec brings in.
          # pull the results back to the runner through the docker API
          mkdir -p "$RUNNER_TEMP/live"
          docker cp scanbox:/out/live/. "$RUNNER_TEMP/live/"
          docker rm -f scanbox >/dev/null
          docker volume rm scanout >/dev/null

      - name: Dump diagnostics (targets failed)
        if: failure()
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          cd /tmp/crAPI-1.1.5/deploy/docker 2>/dev/null || true
          echo "--- compose ps ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps -a 2>/dev/null || true
          echo "--- web logs ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml logs --tail 40 crapi-web 2>/dev/null || true
          echo "--- identity logs ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml logs --tail 40 crapi-identity 2>/dev/null || true
          echo "--- dvga logs ---"
          docker logs dvga 2>/dev/null | tail -30 || true

      - name: Upload live-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-validation-crapi-dvga
          path: |
            ${{ runner.temp }}/live/live-validation.json
            ${{ runner.temp }}/live/crapi-scan.json
            ${{ runner.temp }}/live/dvga-scan.json
            ${{ runner.temp }}/ground-truth-sha.json
          if-no-files-found: error
  r10-lifecycle-chains:
    name: R10 (crAPI lifecycle NEW->RECURRING + chain rules on live results)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      docker:
        image: docker:27-dind
        options: >-
          --privileged
          --name docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start crAPI (official compose v1.1.5 + latest images, bridge vars)
        run: |
          set +e
          # same pinned compose + bridge variables as the battery job — the
          # full rationale (chatbot/mailhog upstreams, LISTEN_IP, dind port
          # publishing) is documented there and verified by its prior runs.
          curl -sL -o /tmp/crapi.zip https://github.com/OWASP/crAPI/archive/refs/tags/v1.1.5.zip
          unzip -q /tmp/crapi.zip -d /tmp
          cd /tmp/crAPI-1.1.5/deploy/docker
          cat > docker-compose.override.yml <<'YAML'
          services:
            crapi-web:
              environment:
                - CHATBOT_SERVICE=crapi-workshop:8000
                - MAILHOG_WEB_SERVICE=mailhog:8025
          YAML
          sed -i 's|^LISTEN_IP=.*|LISTEN_IP=0.0.0.0|' .env
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker compose -f docker-compose.yml -f docker-compose.override.yml pull
          docker compose -f docker-compose.yml -f docker-compose.override.yml --compatibility up -d
          echo "compose up exit: $?"

      - name: Start DVGA (official Docker Hub image)
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker run -d --name dvga -p 5013:5013 -e WEB_HOST=0.0.0.0 dolevf/dvga

      - name: Fetch the operator spec (crAPI main-branch openapi)
        run: |
          mkdir -p .live-spec
          curl -sL -o .live-spec/crapi-openapi-spec.json \
            https://raw.githubusercontent.com/OWASP/crAPI/main/openapi-spec/crapi-openapi-spec.json
          sha256sum .live-spec/crapi-openapi-spec.json

      - name: Run r10 live validation (two crAPI scans sharing a lifecycle store + chain evaluation)
        # same scan-inside-the-dind pattern as the battery job (run
        # 41286864928 lesson). scanbox sleeps 2400s: THIS job runs TWO
        # full crAPI scans back-to-back plus a DVGA scan — the battery's
        # 900s box would die mid-scan-2.
        run: |
          set -e
          export DOCKER_HOST=unix:///var/run/docker.sock
          docker volume create scanout >/dev/null
          docker run -d --name scanbox --network host \
            -v scanout:/out python:3.12-slim sleep 2400 >/dev/null
          docker exec scanbox mkdir -p /ws
          tar --exclude=.git --exclude=node_modules --exclude=.next \
            -cf - . | docker exec -i scanbox tar -xf - -C /ws
          docker exec scanbox python3 - <<'PY'
          import sys, time, urllib.request
          targets = [
              ("crAPI", "http://127.0.0.1:8888/web/health"),
              ("DVGA",  "http://127.0.0.1:5013/"),
          ]
          for name, url in targets:
              for attempt in range(90):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as r:
                          if r.status < 500:
                              print(f"{name} up (attempt {attempt + 1})")
                              break
                  except Exception:
                      pass
                  time.sleep(2)
              else:
                  print(f"::error::{name} did not come up in 180s")
                  sys.exit(1)
          PY
          # the verdict JSON is written inside scanbox on EVERY path
          # (success, gate failure, mid-scan death) — the copy-out below
          # is UNCONDITIONAL (run 41918334837 lost its verdict to set -e
          # killing the step before docker cp); the step then fails with
          # the script's own exit code.
          set +e
          docker exec -e BURHAN_LIVE_OAST=${{ inputs.oast || 'local' }} scanbox \
            python3 /ws/scripts/live_validate_r10.py \
            --crapi http://127.0.0.1:8888 \
            --dvga http://127.0.0.1:5013 \
            --crapi-spec /ws/.live-spec/crapi-openapi-spec.json \
            --max-requests 12000 \
            --out-dir /out/r10
          EXEC_RC=$?
          set -e
          mkdir -p "$RUNNER_TEMP/r10"
          docker cp scanbox:/out/r10/. "$RUNNER_TEMP/r10/" || true
          docker rm -f scanbox >/dev/null
          docker volume rm scanout >/dev/null
          exit $EXEC_RC

      - name: Dump diagnostics (targets failed)
        if: failure()
        run: |
          export DOCKER_HOST=unix:///var/run/docker.sock
          cd /tmp/crAPI-1.1.5/deploy/docker 2>/dev/null || true
          echo "--- compose ps ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps -a 2>/dev/null || true
          echo "--- web logs ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml logs --tail 40 crapi-web 2>/dev/null || true

      - name: Upload r10 live-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # the verdict JSON is written on EVERY path (success, gate
          # failure, mid-scan death); the scan reports and store db
          # exist only as far as the run got — warn, never error: a
          # failed run must still hand back its verdict artifact.
          name: r10-live-validation-crapi-dvga
          path: |
            ${{ runner.temp }}/r10/r10-live-validation.json
            ${{ runner.temp }}/r10/r10-pass1-scan.json
            ${{ runner.temp }}/r10/r10-pass2-scan.json
            ${{ runner.temp }}/r10/r10-dvga-scan.json
            ${{ runner.temp }}/r10/r10-lifecycle-store.db
          if-no-files-found: warn
